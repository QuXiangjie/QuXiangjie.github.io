<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin | Workflow Entrepreneur</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>Blog Admin</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="hint">Default password: admin123</p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" style="display: none;">
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <h1>Blog Admin</h1>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">← Back to Site</a></li>
                    <li><a href="#" id="logout-btn">Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="container admin-container">
            <div class="admin-header">
                <h2>Manage Blog Posts</h2>
                <button id="new-post-btn" class="btn">+ New Post</button>
            </div>

            <div id="posts-list" class="posts-list">
                <!-- Posts will be loaded here -->
            </div>
        </main>

        <!-- Post Editor Modal -->
        <div id="editor-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="editor-title">Create New Post</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <form id="post-form">
                    <div class="form-group">
                        <label for="post-title">Title *</label>
                        <input type="text" id="post-title" required>
                    </div>

                    <div class="form-group">
                        <label for="post-excerpt">Excerpt *</label>
                        <textarea id="post-excerpt" rows="2" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="post-category">Category *</label>
                            <select id="post-category" required>
                                <option value="tech">Tech</option>
                                <option value="finance">Finance</option>
                                <option value="life">Life</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="post-date">Date *</label>
                            <input type="date" id="post-date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="post-content">Content (HTML) *</label>
                        <textarea id="post-content" rows="15" required></textarea>
                        <small>Use HTML tags: &lt;p&gt;, &lt;h2&gt;, &lt;h3&gt;, &lt;ul&gt;, &lt;li&gt;, &lt;strong&gt;, etc.</small>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
                        <button type="submit" class="btn">Save Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
